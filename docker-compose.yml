name: bruinen

services:
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: bruinen
    networks:
      - internal
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_TAILSCALED_EXTRA_ARGS=--port=0
      - TS_AUTH_ONCE=true
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
    command: sh -c "rm -f /var/run/tailscale/tailscaled.sock && /usr/local/bin/containerboot"
    volumes:
      - ./serve.json:/config/serve.json:ro
      - tailscale-state:/var/lib/tailscale
      - tailscale-sock:/var/run/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:41234/healthz']
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    networks:
      internal:
        # Must differ from the sidecar hostname, or Serve would proxy to itself.
        aliases:
          - bruinen-app
      # Rivendell's network, so the server reaches PocketBase at rivendell-app:8090.
      rivendell:
    environment:
      - POCKETBASE_URL=${POCKETBASE_URL:-http://rivendell-app:8090}
      # Required: without it adapter-node derives an http:// origin behind Tailscale Serve and
      # every form POST (login included) fails its CSRF check.
      - ORIGIN=${ORIGIN:?set ORIGIN in .env to https://bruinen.<your-tailnet>.ts.net}
      # Bruinen's own B2 key for cover uploads. The cover control stays hidden until all four are set.
      - B2_APP_KEY_ID=${B2_APP_KEY_ID:-}
      - B2_APP_KEY=${B2_APP_KEY:-}
      - B2_BUCKET_ID=${B2_BUCKET_ID:-}
      - B2_BUCKET_NAME=${B2_BUCKET_NAME:-}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/login']
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      tailscale:
        condition: service_healthy

# Tailscale state is bind-mounted from TAILSCALE_STATE_DIR. If the folder is missing (e.g. an
# external drive isn't mounted), the volume fails to mount and the stack won't start on empty state.
volumes:
  tailscale-state:
    name: bruinen_tailscale-state
    driver_opts:
      { type: none, o: bind, device: '${TAILSCALE_STATE_DIR:?set TAILSCALE_STATE_DIR in .env}' }
  tailscale-sock:
    name: bruinen_tailscale-sock

networks:
  internal:
    name: bruinen_internal
  rivendell:
    name: rivendell_internal
    external: true
